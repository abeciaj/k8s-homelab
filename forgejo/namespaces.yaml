# Forgejo and its runner live in separate namespaces so Pod Security can be strict
# where it's possible and loose only where it has to be.
# Applied by scripts/install-forgejo.sh before the chart.

# Forgejo itself runs rootless, so the whole namespace enforces "restricted".
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Docker-in-Docker needs a privileged container, so only this namespace allows it.
# Nothing else should be deployed here.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
