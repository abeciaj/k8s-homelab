# Overrides for the Trivy Operator chart (trivy-operator at aquasecurity.github.io/helm-charts).
# Chart version is pinned in scripts/install-trivy-operator.sh. Check these keys when bumping it.

operator:
  # One shared Trivy server keeps the vulnerability database, instead of every scan
  # job downloading its own copy.
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3
  # Node checks (node-collector) need hostPath mounts and expect kubeadm paths, not
  # k3s's. scripts/run-kube-bench.sh runs the k3s CIS benchmark on the node instead.
  infraAssessmentScannerEnabled: false
  # On by default, so the operator can use workloads' image pull secrets. That
  # means reading every Secret in the cluster, the Homelab CA key included. Every
  # image here is public, so it doesn't need them.
  accessGlobalSecretsAndServiceAccount: false
  # One metric per CVE, for the Issues table in dashboard.json. It's off by default
  # because it multiplies metrics on large clusters; with only fixable high and
  # critical findings here, it stays small.
  metricsVulnIdEnabled: true

# Images pinned by digest as well as version. In March 2026, Trivy release tags
# were repointed at malicious builds; a digest can't be repointed. Update both
# together when bumping CHART_VERSION (see security/README.md).
image:
  tag: "0.35.0@sha256:4cdb11af98ff409cfa7af980098203a841a5fe957cc6a0bbb0df7668065eb5fa"

trivyOperator:
  # Scan jobs run in this namespace, which enforces Pod Security "restricted". The
  # Trivy image defaults to root, so run it as nobody.
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

trivy:
  # Used by the Trivy server and every scan job. With a digest, reports show it as
  # the scanner version instead of 0.75.0.
  image:
    tag: "0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
  # Only findings you can act on: high or critical, with a fixed version available.
  severity: HIGH,CRITICAL
  ignoreUnfixed: true
  # Resources for each scan job. Large images need more than the chart's 500M.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  # The database volume. It's re-downloadable, so local-path pinning it to one node
  # only costs a re-download if that node is lost.
  storageClassName: local-path
  server:
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# The CIS spec depends on the node checks turned off above.
compliance:
  specs:
    - k8s-nsa-1.0
    - k8s-pss-baseline-0.1
    - k8s-pss-restricted-0.1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
