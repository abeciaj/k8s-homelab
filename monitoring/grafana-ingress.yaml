# HTTPS only, using Traefik's built-in self-signed certificate, so the Grafana
# login never crosses the LAN in plain text. Browsers warn once about the
# certificate; a trusted one needs cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - grafana.home.lab
  rules:
    - host: grafana.home.lab   # add this to your router's DNS or /etc/hosts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
