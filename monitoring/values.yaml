# Overrides for prometheus-community/kube-prometheus-stack.
# The chart defaults are fine at homelab scale; this file is the place to tune them.
# Chart version is pinned in scripts/install-monitoring.sh. Check these keys when bumping it.
#
# Don't commit a Grafana password here. scripts/install-monitoring.sh creates the
# grafana-admin Secret, and the chart reads the password from it (see grafana.admin).

prometheus:
  prometheusSpec:
    retention: 15d       # chart default is 10d
    retentionSize: 8GB   # whichever limit is hit first wins; keep below the volume size

    # Without this, metrics live in an emptyDir and vanish when the pod restarts.
    # local-path (bundled with k3s) pins the volume to one node. Move to Longhorn
    # once it's installed, so the data survives losing that node.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Memory grows with the number of active series. The limit stops a runaway
    # scrape from starving the node. No CPU limit, so compaction isn't throttled.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

grafana:
  # Login comes from the Secret created by install-monitoring.sh. Passing it with
  # --set would store it in Helm's release history.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Most of these are already Grafana's defaults. Stating them keeps a future
  # chart or Grafana release from quietly changing them.
  grafana.ini:
    users:
      allow_sign_up: false
      allow_org_create: false
    auth.anonymous:
      enabled: false
    security:
      disable_gravatar: true    # no requests to gravatar.com leaking user emails
      cookie_samesite: strict
    snapshots:
      external_enabled: false   # no "publish snapshot" to snapshots.raintank.io
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false

  # Keeps dashboards, users and settings made in the UI across restarts.
  # Same local-path caveat as Prometheus: the volume lives on one node.
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 2Gi

  # A ReadWriteOnce volume can't be shared by the old and new pod during a
  # rolling update, so replace the pod instead.
  deploymentStrategy:
    type: Recreate

  # Grafana 13 idles around 300Mi and spikes while a dashboard runs its queries
  # in parallel. Below about 1Gi, opening a large dashboard can get it OOMKilled.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

prometheus-node-exporter:
  # Setting extraArgs replaces the chart's list, so its two filesystem excludes are
  # repeated here. The textfile directory is where the Ansible audit play
  # (--tags audit) writes Lynis and debsecan results; the host's / is already
  # mounted read-only at /host/root.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector

# k3s runs the scheduler, controller-manager, kube-proxy and etcd inside the k3s
# binary, so there are no separate endpoints to scrape. Left enabled, their
# targets show as down and their "...Down" alerts fire permanently.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
